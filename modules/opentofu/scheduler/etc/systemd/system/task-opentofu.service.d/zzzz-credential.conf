[Unit]
Requires=openbao-credential-broker.service
After=openbao-credential-broker.service

[Service]
LoadCredential=incus-client:/run/openbao-credential-broker/socket
LoadCredential=opentofu-s3-credentials:/run/openbao-credential-broker/socket
LoadCredential=opentofu-incus-client:/run/openbao-credential-broker/socket
LoadCredential=openbao-approle-secret-id:/run/openbao-credential-broker/socket
LoadCredential=openbao-ca:/etc/openbao/tls.crt
