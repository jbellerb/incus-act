#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - iptables
  - jq
  - openssl
  - runsc
runcmd:
  - |
    archive=/run/buildkit-v0.33.1.linux-amd64.tar.gz
    curl --fail --location --silent --show-error --output "$archive" \
        https://github.com/moby/buildkit/releases/download/v0.33.1/buildkit-v0.33.1.linux-amd64.tar.gz || exit 1
    printf '%s  %s\n' \
        4e044bcd62a0c0bbe6a8c94d73989de2bfe4c04dbc0f9d6021cf96b72cd1d965 \
        "$archive" | sha256sum --check --status || exit 1
    tar --extract --gzip --file "$archive" --directory /usr/local || exit 1
  - [/usr/local/libexec/generate-buildkit-tls]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, buildkit.service]
