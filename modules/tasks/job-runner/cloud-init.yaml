#cloud-config
users: []
# minimal set of modules, excluding SSH and user setup
cloud_init_modules:
  - write-files
  - set_hostname
  - update_hostname
  - update_etc_hosts
package_update: true
packages:
  - ca-certificates
  - curl
runcmd:
  - |
    archive=/run/buildkit-v0.33.1.linux-amd64.tar.gz
    curl --fail --location --silent --show-error --output "$archive" \
        https://github.com/moby/buildkit/releases/download/v0.33.1/buildkit-v0.33.1.linux-amd64.tar.gz || exit 1
    printf '%s  %s\n' \
        4e044bcd62a0c0bbe6a8c94d73989de2bfe4c04dbc0f9d6021cf96b72cd1d965 \
        "$archive" | sha256sum --check --status || exit 1
    tar --extract --gzip --file "$archive" --directory /usr/local bin/buildctl || exit 1
  - [systemctl, daemon-reload]
  - [systemctl, enable, job-runner.service]
